<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Login</title>
    <meta data-i18n-meta="metaDescription" content="Admin login for EzySpeech" name="description">
    <!-- Favicon will be set by OEM loader -->
    <!-- PatternFly carries Red Hat Text and Display itself, so the fonts no
         longer come from Google and nothing here reaches outside the network
         this runs on. -->
    <link href="{{ static_url('patternfly/patternfly.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/login.css') }}" rel="stylesheet">
    <!-- OEM Configuration Loader -->
    <script src="{{ static_url('js/oem-loader.js') }}"></script>
</head>

<body data-theme="light" data-page="login">
    <!-- PatternFly's login page is laid out around a background image; the
         pattern ships with the design system. -->
    <div class="pf-v6-c-background-image"></div>

    <div class="pf-v6-c-login">
        <div class="pf-v6-c-login__container">
            <!-- Logotype. The .login-logo-icon class is where oem-loader.js
                 puts a customer's brand image, so it stays. -->
            <header class="pf-v6-c-login__header">
                <div class="login-logo-icon">
                    <img class="pf-v6-c-brand" src="{{ static_url('img/mabc-mark.png') }}" width="208" height="208"
                        alt="Mt Albert Baptist">
                </div>
            </header>

            <main class="pf-v6-c-login__main">
                <!-- .login-logo is the hook oem-loader.js looks for to
                     override this heading with a customer's product name. -->
                <header class="pf-v6-c-login__main-header login-logo">
                    <h1 class="pf-v6-c-title pf-m-3xl" data-i18n="adminLogin">Admin Login</h1>
                    <p class="pf-v6-c-login__main-header-desc" data-i18n="loginSubtitle">
                        Sign in to access the admin panel
                    </p>
                </header>

                <div class="pf-v6-c-login__main-body">
                    <form class="pf-v6-c-form" id="loginForm" onsubmit="return false;" novalidate>
                        <div class="pf-v6-c-form__group">
                            <div class="pf-v6-c-form__group-label">
                                <label class="pf-v6-c-form__label" for="username">
                                    <span class="pf-v6-c-form__label-text" data-i18n="username">Username</span>
                                    <span class="pf-v6-c-form__label-required" aria-hidden="true">&#42;</span>
                                </label>
                            </div>
                            <div class="pf-v6-c-form__group-control">
                                <span class="pf-v6-c-form-control pf-m-required">
                                    <input autocomplete="username" id="username" placeholder="Enter your username"
                                        data-i18n-placeholder="username" required type="text">
                                </span>
                            </div>
                        </div>

                        <div class="pf-v6-c-form__group">
                            <div class="pf-v6-c-form__group-label">
                                <label class="pf-v6-c-form__label" for="password">
                                    <span class="pf-v6-c-form__label-text" data-i18n="password">Password</span>
                                    <span class="pf-v6-c-form__label-required" aria-hidden="true">&#42;</span>
                                </label>
                            </div>
                            <div class="pf-v6-c-form__group-control">
                                <!-- PatternFly's input group: the field, then a control
                                     button that reveals what was typed. Both eyes are in
                                     the button; login.css shows the one that matches. -->
                                <div class="pf-v6-c-input-group">
                                    <div class="pf-v6-c-input-group__item pf-m-fill">
                                        <span class="pf-v6-c-form-control pf-m-required">
                                            <input autocomplete="current-password" id="password"
                                                placeholder="Enter your password" data-i18n-placeholder="password"
                                                required type="password">
                                        </span>
                                    </div>
                                    <div class="pf-v6-c-input-group__item">
                                        <button class="pf-v6-c-button pf-m-control" type="button"
                                                id="passwordToggle" aria-controls="password" aria-pressed="false"
                                                aria-label="Show password" data-i18n-title="showPassword"
                                                onclick="togglePassword()">
                                            <span class="pf-v6-c-button__icon"><svg class="pf-v6-svg icon-eye" viewBox="0 0 576 512" fill="currentColor" aria-hidden="true" role="img" width="1em" height="1em"><path d="M572.52 241.4C518.29 135.59 410.93 64 288 64S57.68 135.64 3.48 241.41a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.32-71.64 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400a144 144 0 1 1 144-144 143.93 143.93 0 0 1-144 144zm0-240a95.31 95.31 0 0 0-25.31 3.79 47.85 47.85 0 0 1-66.9 66.9A95.78 95.78 0 1 0 288 160z"/></svg><svg class="pf-v6-svg icon-eye-slash" viewBox="0 0 640 512" fill="currentColor" aria-hidden="true" role="img" width="1em" height="1em"><path d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z"/></svg></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PatternFly's helper text in its error state. The inner
                             span is what login.js writes a failed sign-in into,
                             and it is a live region so a screen reader hears it. -->
                        <div class="pf-v6-c-helper-text login-error">
                          <div class="pf-v6-c-helper-text__item pf-m-error">
                            <span class="pf-v6-c-helper-text__item-text" id="loginError"
                                  role="alert" aria-live="polite"></span>
                          </div>
                        </div>

                        <div class="pf-v6-c-form__group pf-m-action">
                            <div class="pf-v6-c-form__actions">
                                <button class="pf-v6-c-button pf-m-primary pf-m-block" id="loginButton" type="submit"
                                    data-i18n="signIn">
                                    <span class="pf-v6-c-button__text">Log in</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

            </main>

            <!-- Description, the area PatternFly reserves beside the card. -->
            <footer class="pf-v6-c-login__footer">
                <p class="pf-v6-c-content--p" data-i18n="loginBlurb">
                    Live transcription and translation for events. Speak once, and everyone
                    follows along in their own language.
                </p>
            </footer>
        </div>
    </div>

    <script src="{{ static_url('js/i18n.js') }}"></script>
  <script src="{{ static_url('js/theme.js') }}"></script>
    <script src="{{ static_url('js/login.js') }}"></script>
</body>

</html>
