name: Security checks

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Known vulnerabilities in the dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bandit
        run: pip install bandit
      # Medium severity and up. tools/ is left out: page generators and data
      # builders run by a developer, never on a server. A finding that is
      # deliberate says so with "# nosec <id>" and a comment above saying why.
      - name: Static analysis
        run: bandit -r . -x ./venv,./.venv,./tools,./node_modules -ll
