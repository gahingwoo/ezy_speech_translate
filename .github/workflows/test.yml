# Installs this checkout each of the three ways, on a throwaway runner, and
# uses it from the outside as people do: see tests/smoke/check.py. The
# release workflow runs this first, and publishes nothing unless it passes.
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # The code itself: the unit tests, and every generated file as its
  # generator makes it (a template or language file edited by hand is lost
  # the next time anyone runs the generator, so it fails here first).
  code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -q -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q -W error::DeprecationWarning tests/unit
      - name: Generated files are their generators' output
        run: |
          for r in render_user render_admin render_config render_projection render_transcript; do
            python3 tools/patternfly/$r.py
          done
          node tools/i18n/build.mjs
          # Each page's own PatternFly stylesheet, from what the page names:
          # a class added to a page and not built in fails here.
          sh tools/patternfly/build.sh
          git diff --exit-code -- app/templates app/static/js/i18n app/static/patternfly

  # Each way of installing, serving each way (app/core/concurrency.py):
  # eventlet's green threads, and real threads under gunicorn, which are to
  # replace them (docs/EVENTLET_MIGRATION.md).
  install-and-use:
    name: ${{ matrix.mode }}, ${{ matrix.concurrency }}
    strategy:
      fail-fast: false
      matrix:
        mode: [native, docker, podman]
        concurrency: [eventlet, threading]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install, ${{ matrix.mode }}
        run: |
          PW=$(openssl rand -hex 12)
          echo "::add-mask::$PW"
          echo "PW=$PW" >> "$GITHUB_ENV"
          # echo: translations made here, so nothing leaves the runner
          sudo env EZY_ADMIN_PASSWORD="$PW" EZY_TRANSLATION_PROVIDERS=echo \
               EZY_CONCURRENCY=${{ matrix.concurrency }} \
               python3 ops/ezyspeech install --mode ${{ matrix.mode }} --source . --progress

      - name: Python for the checks
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q requests "python-socketio[client,asyncio_client]==5.16.2" aiohttp

      - name: Used as people use it
        run: |
          /tmp/smoke/bin/python tests/smoke/check.py live --password "$PW" \
              --concurrency ${{ matrix.concurrency }}

      # The pages in a real browser, once for each way of serving: they are
      # the same pages however EzySpeech is installed.
      - name: The pages, in a browser
        if: matrix.mode == 'native'
        run: |
          /tmp/smoke/bin/pip install -q playwright
          /tmp/smoke/bin/python -m playwright install --with-deps chromium
          /tmp/smoke/bin/python tests/browser/pages.py --password "$PW"

      # The listener page looks the same with its own stylesheet as with the
      # full one, element by element, in each state a listener can reach.
      - name: The listener page's own stylesheet
        if: matrix.mode == 'native' && matrix.concurrency == 'eventlet'
        run: |
          # a line naming a passage, for the passage dialog
          /tmp/smoke/bin/python tests/smoke/check.py live --password "$PW" --say "Turn with me to Romans 8:28"
          /tmp/smoke/bin/python tools/patternfly/same_look.py user --phone --password "$PW"

      - name: Status says what it is
        run: |
          sudo ezyspeech status
          sudo ezyspeech status --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["mode"] == "${{ matrix.mode }}", d["mode"]
          assert d["concurrency"] == "${{ matrix.concurrency }}", d["concurrency"]
          assert d["running"], d["health"]
          assert d["usage"]["processes"], d["usage"]'

      # 300 listeners reading two languages for a minute while a speaker
      # talks (tools/loadtest/listeners.py): every line reaches every one of
      # them, none is dropped, and what it took goes in the job's summary,
      # to compare the two ways of serving. The ten-minute run in the plan
      # is for a machine of one's own; here it would hold up every release.
      - name: Under load
        run: |
          ulimit -n 8192 || true
          /tmp/smoke/bin/python tools/loadtest/listeners.py http://127.0.0.1 "$PW" "300:60" \
              2>/tmp/load.log | tee /tmp/load.json
          sudo ezyspeech status --json > /tmp/status.json
          python3 - <<'PY'
          import json, os
          load = [json.loads(l) for l in open('/tmp/load.json') if l.startswith('{')][-1]
          procs = json.load(open('/tmp/status.json'))['usage']['processes']
          memory = ', '.join(f"{p['name']} {round(p['memory'] / 2**20)} MB" for p in procs if p.get('memory'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### ${{ matrix.mode }}, ${{ matrix.concurrency }}: 300 listeners, 60 s\n\n'
                        f"| line ms p50/p95/p99/max | interim ms p50/p95/p99/max | missed | disconnects | memory after |\n"
                        f"|---|---|---|---|---|\n"
                        f"| {load['line_ms_p50_p95_p99_max']} | {load['interim_ms_p50_p95_p99_max']} "
                        f"| {load['lines_missed_pct']} % | {load['disconnects']} | {memory} |\n")
          assert load['connected'] == 300 and load['connect_fail'] == 0, load
          assert load['lines_missed_pct'] == 0 and load['disconnects'] == 0, load
          assert load['line_ms_p50_p95_p99_max'][1] < 2000, load
          PY

      - name: Backed up, and put back
        run: |
          sudo ezyspeech backup /tmp/before.tar.gz
          /tmp/smoke/bin/python tests/smoke/check.py live --password "$PW" --say "Said after the backup"
          sudo ezyspeech restore /tmp/before.tar.gz --yes
          /tmp/smoke/bin/python tests/smoke/check.py history \
              --has "Grace and peace to you" --has-not "Said after the backup"
          sudo ezyspeech backup --list

      - name: A new admin password, typed in, and a new username
        run: |
          NEW=$(openssl rand -hex 12)
          echo "::add-mask::$NEW"
          printf '%s\n' "$NEW" | sudo ezyspeech password --stdin --json
          /tmp/smoke/bin/python tests/smoke/check.py live --password "$NEW" --say "With the new password"
          sudo ezyspeech username smoke.user --json
          sudo ezyspeech status --json | python3 -c '
          import json, sys; d = json.load(sys.stdin); assert d["username"] == "smoke.user", d.get("username")'
          /tmp/smoke/bin/python tests/smoke/check.py live --user smoke.user --password "$NEW" \
              --say "With a new name"

      - name: Backups on a timer
        run: |
          sudo ezyspeech auto-backup status --json | python3 -c '
          import json, sys; d = json.load(sys.stdin); assert d["on"], d'
          sudo systemctl start ezyspeech-backup.service
          sudo ezyspeech backup --list --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert any(b["auto"] for b in d["backups"]), d'

      - name: Uninstalled
        run: |
          sudo ezyspeech uninstall --yes
          ! sudo ezyspeech status 2>/dev/null

      - name: The log, when something failed
        if: failure()
        run: sudo ezyspeech logs -n 200 || sudo journalctl -n 200 --no-pager
